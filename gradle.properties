# Project coordinates
# Maven Central namespace is GitHub-based: io.github.<github-org>. The Java package names
# in the source tree (`io.ekbatan.*`) intentionally don't match the Maven groupId - they
# don't need to, and `io.ekbatan` reads cleaner as a Java package than `io.github.ekbatan-io`.
group=io.github.ekbatan-io
version=1.1.3

# Plugin versions
spotlessVersion=8.10.4
checkstyleVersion=14.3.0
jooqDockerPluginVersion=9.0.9

# JUnit versions
junitBomVersion=6.1.3
junitJupiterVersion=6.1.3
junitPlatformLauncherVersion=6.1.3
mockkVersion=1.14.11
assertjVersion=3.27.7
mockitoVersion=5.24.0
jsonUnitVersion=6.3.0

# Core Dependencies
jooqVersion=3.21.9
postgresqlVersion=42.7.14
mariadbJavaClientVersion=4.0.0
mysqlConnectorVersion=26.10.0
hikariCpVersion=7.1.0
# commons-lang3 is no longer used by framework code; this version is kept for the
# integration tests and example projects that still consume it.
commonsLang3Version=3.21.0
# Jackson 3.1, not 3.2: 3.2 needs jackson-annotations 2.22, and Quarkus 3.40's BOM pins 2.21, so
# a Quarkus app fails with NoClassDefFoundError: JsonApplyView. Move to 3.2 once Quarkus does.
jacksonDatabindVersion=3.1.8
# Jackson 2, used only by the Avro Debezium SMT. Not a second JSON stack by choice: Avro 1.12
# depends on Jackson 2 internally, so it is in that fat JAR regardless, and the SMT reuses it
# rather than adding Jackson 3 alongside. Never older than what avro resolves (2.22.1 for avro
# 1.12.2), which would be replaced anyway; newer here because 2.22.1 has known vulnerabilities.
jackson2Version=2.22.4
flywayVersion=13.10.3
testcontainersVersion=2.0.5
# Test only: generates the throwaway TLS certificates of the client-certificate login tests.
bouncyCastleVersion=1.86

# Logging
slf4jVersion=2.0.20

# Spring Boot
springBootVersion=4.1.2

# Quarkus
quarkusVersion=3.40.1.1

# Micronaut
micronautVersion=4.10.22
micronautGradlePluginVersion=4.6.2
# Ekbatan builds against Micronaut 4, the oldest it supports: what Micronaut generates at build
# time runs on newer versions, not on older ones. CI also runs the Micronaut integration test as a
# Micronaut 5 app, on these versions (bumped by hand: the weekly dependency check doesn't see them):
#     ./gradlew :ekbatan-integration-tests-di-micronaut:test -Pmicronaut5
micronaut5Version=5.2.4
micronaut5CoreVersion=5.2.20
micronaut5GradlePluginVersion=5.0.2

# OpenTelemetry
opentelemetryVersion=1.67.0

# Kafka & Debezium
kafkaClientsVersion=4.4.0
debeziumVersion=3.7.0.Final

# Avro decodes only into classes on its allow-list (since 1.12.2). ActionEvent puts itself there
# (ekbatan-events/streaming/action-event/avro); a consumer's own payload classes still need
# org.apache.avro.SERIALIZABLE_PACKAGES.
avroVersion=1.12.2

# Protobuf
protobufVersion=4.36.2
protobufGradlePluginVersion=0.10.0

# Annotation Processor
javaPoetVersion=1.13.0

# Distributed Jobs
dbSchedulerVersion=16.12.0

# Test utilities
awaitilityVersion=4.3.0

# Structured concurrency
joxVersion=0.6.0

# Redis
redissonVersion=4.8.0
testcontainersRedisVersion=3.0.0

# Build performance
# Cross-project parallelism is OPT-IN via the `--parallel` flag, not the default. Two
# plugins on this build (GraalVM Build Tools' `collectReachabilityMetadata` and
# Quarkus' `validateExtension`) resolve cross-project configurations at execution time,
# which Gradle 9 rejects under parallel mode with "Resolution of the configuration ...
# was attempted without an exclusive lock." Until both plugins are fixed upstream,
# `clean build` must run sequentially. For the nativeTest sweep where the wins land,
# pass `--parallel --max-workers=4` explicitly:
#     ./gradlew nativeTest --parallel --max-workers=4 --continue
# RAM-wise, each native-image build uses ~4-6 GB during analysis (with the trimmed
# Features), so 4 concurrent builds fit on a 32 GB machine.

# Daemon heap. Gradle 9's default 512 MiB max heap thrashes the GC during our build —
# the shadowJar tasks on the Debezium SMT modules trip it on CI's smaller daemons. 4 GB
# is comfortable headroom on both 16 GB GitHub-hosted runners and typical dev machines.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
