spring:
  application:
    name: spring-boot-job-worker-gradle-pg
  main:
    web-application-type: none

# Two configured shards. Each action execution in this example touches one shard only;
# cross-shard actions are not enabled.
ekbatan:
  namespace: example.wallet.worker
  sharding:
    defaultShard:
      group: 0
      member: 0
    groups:
      - group: 0
        name: global
        members:
          - member: 0
            name: global
            configs:
              primaryConfig:
                # Extra JDBC driver settings, each name exactly as the driver spells it; handed to the driver beside the URL, never printed.
                dataSourceProperties:
                  ApplicationName: wallet-service
                jdbcUrl: jdbc:postgresql://localhost:5432/wallet_global
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 20
              jobsConfig:
                jdbcUrl: jdbc:postgresql://localhost:5432/wallet_global
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 5
              lockConfig:
                jdbcUrl: jdbc:postgresql://localhost:5432/wallet_global
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 30
                leakDetectionThreshold: 0
      - group: 1
        name: mexico
        members:
          - member: 0
            name: mexico
            configs:
              primaryConfig:
                dataSourceProperties:
                  ApplicationName: wallet-service
                jdbcUrl: jdbc:postgresql://localhost:5433/wallet_mexico
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 20
              jobsConfig:
                jdbcUrl: jdbc:postgresql://localhost:5433/wallet_mexico
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 5
              lockConfig:
                jdbcUrl: jdbc:postgresql://localhost:5433/wallet_mexico
                username: wallet
                password: wallet
                driverClassName: org.postgresql.Driver
                maximumPoolSize: 30
                leakDetectionThreshold: 0
  # ISO-8601, the format java.time.Duration.parse accepts - PT10S, and not Spring's own PT10S
  # shorthand equivalent "10s", which the binder rejects. Shown here because the shipped
  # configuration is what gets copied; WalletJobsIntegrationTest sets its own durations through
  # @SpringBootTest(properties = ...) and those override this file, so this line documents the
  # format rather than guarding it.
  jobs:
    pollingInterval: PT10S

  local-event-handler:
    handling:
      enabled: true

logging:
  level:
    io.ekbatan: INFO
    io.example.wallet: DEBUG
