name: Heavy Verification

on:
  schedule:
    # Run shortly after midnight UTC, but only continue if main changed during
    # the previous UTC day.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual run mode"
        required: true
        type: choice
        default: respect-recent-activity
        options:
          - respect-recent-activity
          - force

permissions:
  contents: read

concurrency:
  group: heavy-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  # GitHub-hosted runners are disposable VMs, so runner teardown cleans up test
  # containers. Avoid failing heavy verification before tests start if Docker Hub
  # cannot serve the optional Testcontainers Ryuk reaper image.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  activity:
    name: Check Recent Activity
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.activity.outputs.should_run }}
      reason: ${{ steps.activity.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Whether To Run
        id: activity
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_mode }}" == "force" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual force run" >> "$GITHUB_OUTPUT"
            echo "Heavy verification was manually triggered with run_mode=force." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run requested run_mode=respect-recent-activity; applying the recent-activity gate." >> "$GITHUB_STEP_SUMMARY"
          fi

          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

          since="$(date -u -d 'yesterday 00:00' '+%Y-%m-%dT%H:%M:%SZ')"
          until="$(date -u -d 'today 00:00' '+%Y-%m-%dT%H:%M:%SZ')"
          commit="$(git log --since="$since" --until="$until" --max-count=1 --format=%H origin/main --)"

          if [[ -n "$commit" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=main changed between $since and $until" >> "$GITHUB_OUTPUT"
            echo "Found commits on main between $since and $until." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no commits on main between $since and $until" >> "$GITHUB_OUTPUT"
            echo "No commits on main between $since and $until. Skipping heavy verification." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Enumerates the native-test modules so the matrix below is derived from the build rather
  # than hardcoded here. A hand-maintained list silently drops a newly added module out of
  # native coverage - nothing goes red, the module just stops being verified.
  root-native-modules:
    name: Enumerate Native Test Modules
    needs: activity
    if: needs.activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temurin is enough to configure the build and print the list; no image is compiled here.
      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: List modules
        id: list
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -q nativeTestModules > modules.txt
          # Fail loudly rather than emit an empty matrix, which GitHub would silently
          # expand to zero jobs and report the whole workflow as green.
          test -s modules.txt
          MODULES=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < modules.txt)
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Native test modules ($(wc -l < modules.txt)):" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/  - /' modules.txt >> "$GITHUB_STEP_SUMMARY"

  # One runner per module. Previously a single job compiled all 39 native images in series
  # with --max-workers=1 (two concurrent native-image builds exhaust a runner's memory),
  # which took upwards of 90 minutes. A matrix keeps one image per runner while removing
  # the queue; the memory constraint that forced serialisation no longer applies.
  root-native-tests:
    name: Root Native Tests / ${{ matrix.module }}
    needs: [activity, root-native-modules]
    if: needs.activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.root-native-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 25

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify GraalVM
        shell: bash
        run: |
          java -version
          native-image --version

      - name: Run Native Tests
        shell: bash
        run: |
          export GRAALVM_HOME="$JAVA_HOME"
          ./gradlew \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            :${{ matrix.module }}:nativeTest --stacktrace

      - name: Upload Native Test Reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: root-native-test-reports-${{ matrix.module }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.module }}/build/reports/tests/nativeTest/**
            ${{ matrix.module }}/build/test-results/nativeTest/**
            **/build/reports/tests/nativeTest/**
            **/build/test-results/nativeTest/**

  # The examples get Ekbatan the way an application does, from a Maven repository - but from this
  # commit, not from Maven Central. It is built once here and handed to every example job, which
  # puts it in its runner's ~/.m2; the examples look there before Maven Central. So they test the
  # latest code, and nothing has to be published.
  ekbatan-artifacts:
    name: Build Ekbatan For The Examples
    needs: activity
    if: needs.activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      # An example on another version would quietly fetch that version from Maven Central and test
      # it instead of this commit.
      - name: Check The Examples Use This Version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')
          other=$( { grep -H '^ekbatanVersion=' ekbatan-examples/*/gradle.properties || true; \
                     grep -H '<ekbatan.version>' ekbatan-examples/*/pom.xml || true; } \
            | grep -v -e "ekbatanVersion=$version\$" -e "<ekbatan.version>$version</ekbatan.version>" || true)
          if [[ -n "$other" ]]; then
            echo "::error::These examples are not on Ekbatan $version:"
            echo "$other"
            exit 1
          fi
          echo "Every example is on Ekbatan $version"

      - name: Publish To The Local Maven Repository
        shell: bash
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          mkdir -p ekbatan-m2/io/github
          cp -R ~/.m2/repository/io/github/ekbatan-io ekbatan-m2/io/github/

      - name: Upload Ekbatan
        uses: actions/upload-artifact@v4
        with:
          name: ekbatan-m2
          path: ekbatan-m2
          if-no-files-found: error
          retention-days: 1

  examples-jvm-tests:
    name: Example JVM Tests / ${{ matrix.project }}
    needs: [activity, ekbatan-artifacts]
    if: needs.activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: micronaut-wallet-rest-gradle-mariadb
            command: ./gradlew test --stacktrace
          - project: micronaut-wallet-rest-gradle-mysql
            command: ./gradlew test --stacktrace
          - project: micronaut-wallet-rest-gradle-pg
            command: ./gradlew test --stacktrace
          - project: quarkus-wallet-rest-gradle-mariadb
            command: ./gradlew test --stacktrace
          - project: quarkus-wallet-rest-gradle-mysql
            command: ./gradlew test --stacktrace
          - project: quarkus-wallet-rest-gradle-pg
            command: ./gradlew test --stacktrace
          - project: spring-boot-job-worker-gradle-pg
            command: ./gradlew test --stacktrace
          - project: spring-boot-wallet-rest-gradle-mariadb
            command: ./gradlew test --stacktrace
          - project: spring-boot-wallet-rest-gradle-mysql
            command: ./gradlew test --stacktrace
          - project: spring-boot-wallet-rest-gradle-pg
            command: ./gradlew test --stacktrace
          - project: spring-boot-wallet-rest-gradle-sharded-pg
            command: ./gradlew test --stacktrace
          - project: spring-boot-wallet-saga-gradle-pg
            command: ./gradlew test --stacktrace
          - project: micronaut-wallet-rest-maven-mariadb
            command: ./mvnw -B -ntp verify
          - project: micronaut-wallet-rest-maven-mysql
            command: ./mvnw -B -ntp verify
          - project: micronaut-wallet-rest-maven-pg
            command: ./mvnw -B -ntp verify
          - project: quarkus-wallet-rest-maven-mariadb
            command: ./mvnw -B -ntp verify
          - project: quarkus-wallet-rest-maven-mysql
            command: ./mvnw -B -ntp verify
          - project: quarkus-wallet-rest-maven-pg
            command: ./mvnw -B -ntp verify
          - project: spring-boot-wallet-rest-maven-mariadb
            command: ./mvnw -B -ntp verify
          - project: spring-boot-wallet-rest-maven-mysql
            command: ./mvnw -B -ntp verify
          - project: spring-boot-wallet-rest-maven-pg
            command: ./mvnw -B -ntp verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Ekbatan
        uses: actions/download-artifact@v4
        with:
          name: ekbatan-m2
          path: ekbatan-m2

      - name: Put Ekbatan In The Local Maven Repository
        shell: bash
        run: |
          mkdir -p ~/.m2/repository
          cp -R ekbatan-m2/. ~/.m2/repository/

      - name: Run Example JVM Tests
        working-directory: ekbatan-examples/${{ matrix.project }}
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload Example JVM Test Reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: example-jvm-${{ matrix.project }}-reports
          if-no-files-found: ignore
          path: |
            ekbatan-examples/${{ matrix.project }}/build/reports/tests/**
            ekbatan-examples/${{ matrix.project }}/build/test-results/**
            ekbatan-examples/${{ matrix.project }}/target/surefire-reports/**
            ekbatan-examples/${{ matrix.project }}/target/failsafe-reports/**

  examples-native-tests:
    name: Example Native Verification / ${{ matrix.project }}
    needs: [activity, ekbatan-artifacts]
    if: needs.activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: micronaut-wallet-rest-gradle-native-mariadb
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: micronaut-wallet-rest-gradle-native-mysql
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: micronaut-wallet-rest-gradle-native-pg
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: quarkus-wallet-rest-gradle-native-mariadb
            command: ./gradlew test testNative --stacktrace
            allow_failure: false
          - project: quarkus-wallet-rest-gradle-native-mysql
            command: ./gradlew test testNative --stacktrace
            allow_failure: false
          - project: quarkus-wallet-rest-gradle-native-pg
            command: ./gradlew test testNative --stacktrace
            allow_failure: false
          - project: spring-boot-wallet-rest-gradle-native-mariadb
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: spring-boot-wallet-rest-gradle-native-mysql
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: spring-boot-wallet-rest-gradle-native-pg
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          - project: spring-boot-wallet-rest-gradle-native-sharded-pg
            command: ./gradlew test nativeTest --stacktrace
            allow_failure: false
          # Micronaut Maven native examples currently document native tests as not enabled.
          # Run JVM verification and build the native image as the native-side check.
          - project: micronaut-wallet-rest-maven-native-mariadb
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -Dpackaging=native-image -DskipTests package
            allow_failure: false
          - project: micronaut-wallet-rest-maven-native-mysql
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -Dpackaging=native-image -DskipTests package
            allow_failure: false
          - project: micronaut-wallet-rest-maven-native-pg
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -Dpackaging=native-image -DskipTests package
            allow_failure: false
          - project: quarkus-wallet-rest-maven-native-mariadb
            command: ./mvnw -B -ntp -Dnative verify
            allow_failure: false
          - project: quarkus-wallet-rest-maven-native-mysql
            command: ./mvnw -B -ntp -Dnative verify
            allow_failure: false
          - project: quarkus-wallet-rest-maven-native-pg
            command: ./mvnw -B -ntp -Dnative verify
            allow_failure: false
          - project: spring-boot-wallet-rest-maven-native-mariadb
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -PnativeTest test
            allow_failure: false
          - project: spring-boot-wallet-rest-maven-native-mysql
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -PnativeTest test
            allow_failure: false
          - project: spring-boot-wallet-rest-maven-native-pg
            command: ./mvnw -B -ntp verify && ./mvnw -B -ntp -PnativeTest test
            allow_failure: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify GraalVM
        shell: bash
        run: |
          java -version
          native-image --version

      - name: Download Ekbatan
        uses: actions/download-artifact@v4
        with:
          name: ekbatan-m2
          path: ekbatan-m2

      - name: Put Ekbatan In The Local Maven Repository
        shell: bash
        run: |
          mkdir -p ~/.m2/repository
          cp -R ekbatan-m2/. ~/.m2/repository/

      - name: Run Example Native Tests
        working-directory: ekbatan-examples/${{ matrix.project }}
        shell: bash
        run: |
          export GRAALVM_HOME="$JAVA_HOME"
          if [[ "${{ matrix.command }}" == ./gradlew* ]]; then
            export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.java.installations.paths=$JAVA_HOME -Dorg.gradle.java.installations.auto-detect=false"
          fi
          ${{ matrix.command }}

      - name: Upload Example Native Test Reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: example-native-${{ matrix.project }}-reports
          if-no-files-found: ignore
          path: |
            ekbatan-examples/${{ matrix.project }}/build/reports/tests/**
            ekbatan-examples/${{ matrix.project }}/build/test-results/**
            ekbatan-examples/${{ matrix.project }}/target/surefire-reports/**
            ekbatan-examples/${{ matrix.project }}/target/failsafe-reports/**
