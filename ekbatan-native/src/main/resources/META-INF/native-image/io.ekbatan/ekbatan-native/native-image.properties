# ClassGraph 6 registers its virtual filesystem as a Java filesystem provider. The JDK loads every
# provider while the image is built, so that provider's instance is in the image heap, and its class
# has to be initialized at build time (it holds only itself, a pattern, names and an empty map).
Args = --features=io.ekbatan.graalvm.jackson.Jackson3RecordsFeature --initialize-at-build-time=io.github.classgraph.vfs.VfsFileSystemProvider
